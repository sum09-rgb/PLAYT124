
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1b">
  <title>Create Account - PLAYT124</title>
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand">
      <span class="brand-icon">P</span>
      PLAYT124
    </a>

    <a href="index.html" class="back-link">Home</a>
  </header>

  <main class="auth-container">

    <section class="auth-card">

      <div class="card-heading">
        <div class="card-logo">P</div>
        <h1>Create Account</h1>
        <p>Join PLAYT124 and enter the arena.</p>
      </div>

      <form id="registerForm" novalidate>

        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose your username"
            autocomplete="username"
            minlength="3"
            maxlength="20"
            required
          >
          <small>3–20 characters. Letters, numbers and underscores.</small>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <button type="button" class="toggle-password"
              data-target="password" aria-label="Show password">
              Show
            </button>
          </div>

          <small>Use at least 8 characters.</small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <div class="password-field">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Enter password again"
              autocomplete="new-password"
              required
            >

            <button type="button" class="toggle-password"
              data-target="confirmPassword" aria-label="Show password">
              Show
            </button>
          </div>
        </div>

        <div class="terms-group">
          <label>
            <input type="checkbox" id="terms">
            <span>
              I agree to the PLAYT124 terms and conditions.
            </span>
          </label>
        </div>

        <div id="registerMessage" class="message"
          role="alert" aria-live="polite"></div>

        <button type="submit" class="submit-btn">
          Create Account
        </button>

      </form>

      <div class="divider">
        <span>ALREADY A PLAYER?</span>
      </div>

      <p class="bottom-text">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </section>

  </main>

  <script type="module" src="register.js"></script>
</body>
</html>
