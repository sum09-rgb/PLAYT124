
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d1b">
  <title>Login - PLAYT124</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand">
      <span class="brand-icon">P</span>
      PLAYT124
    </a>

    <a href="index.html" class="back-link">Home</a>
  </header>

  <main class="auth-container">

    <section class="auth-card">

      <div class="card-heading">
        <div class="card-logo">P</div>
        <h1>Welcome Back</h1>
        <p>Login to your PLAYT124 account.</p>
      </div>

      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button type="button" class="toggle-password"
              data-target="password" aria-label="Show password">
              Show
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-option">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember Me</span>
          </label>

          <a href="forgot-password.html" class="forgot-link">
            Forgot Password?
          </a>
        </div>

        <div id="loginMessage" class="message"
          role="alert" aria-live="polite"></div>

        <button type="submit" class="submit-btn">
          Login
        </button>

      </form>

      <div class="divider">
        <span>NEW TO PLAYT124?</span>
      </div>

      <p class="bottom-text">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </p>

    </section>

  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
